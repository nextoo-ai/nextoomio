openapi: 3.1.0
info:
  title: nextoomio Local Control API
  version: 0.0.1-dev
  description: >
    Local REST API contract for nextoomio (`CTL-01`, `I18N-04`, `ARCHITECTURE.md` section 3.4).
    All identifiers, enum values, and error codes are stable machine-readable tokens independent of UI language.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: https://{device_host}/api/v1
    variables:
      device_host:
        default: nextoomio.local
paths:
  /setup/status:
    get:
      summary: Query initial administrator setup status
      operationId: getSetupStatus
      responses:
        '200':
          description: Current setup completion state
          content:
            application/json:
              schema:
                type: object
                required: [completed]
                properties:
                  completed:
                    type: boolean
  /state:
    get:
      summary: Retrieve current device, session, and audio state snapshot
      operationId: getDeviceState
      responses:
        '200':
          description: Device state snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceState'
        '401':
          $ref: '#/components/responses/ApiErrorResponse'
  /volume:
    post:
      summary: Set logical volume with explicit local or group scope (TRN-05)
      operationId: setVolume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, volume_percent]
              properties:
                scope:
                  $ref: '#/components/schemas/CommandScope'
                volume_percent:
                  type: integer
                  minimum: 0
                  maximum: 100
      responses:
        '200':
          description: Volume updated
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
  /update/status:
    get:
      summary: Retrieve current system update staging and validation state (UPD-04, UPD-05)
      operationId: getUpdateStatus
      responses:
        '200':
          description: Update transaction status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
  /update/stage:
    post:
      summary: Stage update payload into preallocated staging reservation (UPD-05, AR-08)
      operationId: stageUpdate
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Update staged successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
  /update/validate:
    post:
      summary: Validate staged update bundle against compatibility and integrity requirements (UPD-04)
      operationId: validateUpdate
      responses:
        '200':
          description: Update validated and bound to transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
  /update/install:
    post:
      summary: Install validated update into the inactive system slot (SYS-05, UPD-05)
      operationId: installUpdate
      responses:
        '200':
          description: Update installed into inactive slot and verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
  /update/trial:
    post:
      summary: Request trial boot of the installed system slot (UPD-06, AR-01)
      operationId: requestTrialUpdate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                auto_reboot:
                  type: boolean
                  default: true
                  description: Whether to trigger immediate trial reboot after arming trial boot.
                remote_confirm:
                  type: boolean
                  default: false
                  description: >-
                    Commit the trial slot only after the deploying workstation confirms it
                    through `/update/confirm` within the trial budget, in addition to the local
                    health check (AD-22). Without it the trial is committed as soon as the local
                    health check passes. Refused with `update_remote_confirm_unavailable` while
                    SSH access is disabled (no valid key file on the selector partition, AD-23);
                    nothing is recorded or armed in that case.
      responses:
        '200':
          description: Trial armed and attempt recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
  /update/confirm:
    post:
      summary: Confirm the trial slot from the deploying workstation (AD-22, UPD-06)
      description: >-
        Phase 0 exposes this operation as `nx-sysd update confirm` over the developer's SSH
        session; confirmation from any other source is out of scope. The confirmation is
        recorded for the current trial attempt only. The trial service commits the slot once
        the local health check has passed: it persists `committing`, makes the trial slot the
        default through the selector operation, reads the selector back, and persists
        `committed` only when the read-back names the trial slot. The call then waits up to
        `wait_secs` for the commit. Repeating a confirmation of an already committed
        transaction changes nothing.
      operationId: confirmTrialUpdate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_id:
                  type: string
                  description: >-
                    Transaction being confirmed. Defaults to the current trial transaction. A
                    different transaction is rejected with `update_transaction_mismatch` and
                    changes nothing.
                wait_secs:
                  type: integer
                  minimum: 0
                  default: 120
                  description: How long to wait for the commit after recording the confirmation.
      responses:
        '200':
          description: >-
            Confirmation recorded and transaction committed (`state` is `committed`). A
            confirmation that was recorded but not yet committed within `wait_secs` returns the
            current status with `confirmed: true` (CLI exit code 3); a commit that failed
            returns `state: failed` with `error_code` (CLI exit code 1).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateStatus'
        '400':
          description: >-
            Confirmation rejected and nothing changed: `update_transaction_mismatch` for another
            transaction, `update_confirm_rejected` when no trial is in progress, the device is
            not running the trial slot, or remote confirmation was not requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /update/health-check:
    get:
      summary: Check system health prerequisites for update trial acceptance (UPD-06, AR-01)
      operationId: checkUpdateHealth
      responses:
        '200':
          description: Local health check evaluation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReport'
        '400':
          $ref: '#/components/responses/ApiErrorResponse'
components:
  schemas:
    UpdateStatus:
      type: object
      required:
        - state
        - active_slot
        - default_slot
        - payload_length
        - reserved_capacity
        - consumed_attempts
      properties:
        initialized:
          type: boolean
          default: true
          description: >-
            False when the update directory holds no journal record yet. Reading the status
            never initializes the directory; it then reports state `idle` (D-065).
        state:
          type: string
          enum: [idle, receiving, staged, validated, installing, installed, trial, committing, committed, failed]
        active_slot:
          type: string
        default_slot:
          type: string
        target_slot:
          type: [string, 'null']
        tx_id:
          type: [string, 'null']
        payload_length:
          type: integer
        reserved_capacity:
          type: integer
        consumed_attempts:
          type: integer
          minimum: 0
        remote_confirm:
          type: boolean
          default: false
          description: Remote confirmation was requested for this transaction (AD-22).
        confirmed:
          type: boolean
          default: false
          description: >-
            The current trial attempt has received its remote confirmation (AD-22). A later
            attempt of the same transaction needs its own confirmation.
        error_code:
          type: [string, 'null']
          description: Machine-readable error code if transaction failed (I18N-04)
        message:
          type: [string, 'null']
    HealthReport:
      type: object
      required:
        - healthy
        - system_target_reached
        - data_mounted
        - sound_card_openable
        - ssh_listening
        - ssh_key_file_present
      properties:
        healthy:
          type: boolean
        system_target_reached:
          type: boolean
        data_mounted:
          type: boolean
        sound_card_openable:
          type: boolean
        ssh_listening:
          type: boolean
        ssh_key_file_present:
          type: boolean
        details:
          type: [string, 'null']
    CommandScope:
      type: string
      enum: [local, group]
    DeviceState:
      type: object
      required:
        - device_id
        - version
        - local_volume_percent
        - local_mute
        - effective_mute
      properties:
        device_id:
          type: string
        version:
          type: string
        session_id:
          type: [string, 'null']
        owner_domain:
          type: [string, 'null']
          enum: [standalone, native_multiroom, music_assistant, null]
        local_volume_percent:
          type: integer
          minimum: 0
          maximum: 100
        local_mute:
          type: boolean
        effective_mute:
          type: boolean
    ApiError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Stable machine-readable error code mapped to catalog keys in the WebUI (I18N-04)
          enum:
            - setup_required
            - setup_already_completed
            - unauthenticated
            - csrf_invalid
            - command_unsupported
            - waiting_for_client
            - source_unreachable
            - format_unsupported
            - playlist_invalid
            - nas_unreachable
            - clock_not_set
            - data_unavailable
            - self_master_rejected
            - topology_cycle_rejected
            - group_level_disabled
            - update_oversized
            - update_invalid_format
            - update_incompatible_hardware
            - update_incompatible_schema
            - update_busy
            - update_truncated
            - update_corrupted_artifact
            - update_trial_failed
            - update_trial_exhausted
            - update_trial_deadline_exceeded
            - update_health_check_failed
            - update_record_contradictory
            - update_journal_corrupted
            - update_remote_confirm_unavailable
            - update_confirm_rejected
            - update_transaction_mismatch
            - update_commit_failed
            - update_commit_interrupted
        details:
          type: object
          additionalProperties: true
  responses:
    ApiErrorResponse:
      description: Machine-readable API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

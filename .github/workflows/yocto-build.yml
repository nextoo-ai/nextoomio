name: Yocto Image Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode: parse-only (fast recipe/layer check) or full-image (BitBake image build)'
        required: true
        default: 'parse-only'
        type: choice
        options:
          - parse-only
          - full-image
  pull_request:
    branches: [main]
    paths:
      - 'kas/**'
      - 'meta-nextoomio/**'
      - 'core/**'
      - '.github/workflows/yocto-build.yml'
  push:
    branches: [main]
    paths:
      - 'kas/**'
      - 'meta-nextoomio/**'
      - 'core/**'
      - '.github/workflows/yocto-build.yml'

concurrency:
  group: yocto-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  parse:
    name: Yocto parse and task graph
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'parse-only')
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build and cache directories
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          mkdir -p "${GITHUB_WORKSPACE}/build" "${GITHUB_WORKSPACE}/yocto-cache/downloads" "${GITHUB_WORKSPACE}/yocto-cache/sstate-cache"

      - name: Restore Yocto downloads and sstate cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ github.workspace }}/yocto-cache/downloads
            ${{ github.workspace }}/yocto-cache/sstate-cache
          key: yocto-ubuntu-24.04-wrynose-${{ hashFiles('kas/**', 'meta-nextoomio/**') }}
          restore-keys: |
            yocto-ubuntu-24.04-wrynose-

      - name: Parse layers and resolve the image task graph
        run: |
          docker run --rm \
            --user=root \
            --security-opt apparmor=unconfined \
            -v "${GITHUB_WORKSPACE}:/work:rw" \
            -w /work \
            -e USER_ID="$(id -u)" \
            -e GROUP_ID="$(id -g)" \
            -e NEXTOOMIO_SOURCE_COMMIT="${{ github.sha }}" \
            -e KAS_WORK_DIR=/work/build \
            -e DL_DIR=/work/yocto-cache/downloads \
            -e SSTATE_DIR=/work/yocto-cache/sstate-cache \
            ghcr.io/siemens/kas/kas:4.5 \
            kas shell /work/kas/ci-hosted.yml -c "bitbake-layers show-layers && bitbake -p nextoomio-image && bitbake -n nextoomio-image"

  full-image:
    name: Yocto full image
    # Never run untrusted pull_request code on the self-hosted runner.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')
    runs-on: [self-hosted, nextoomio-build]
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build full nextoomio Yocto image
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build"
          docker run --rm \
            --user=root \
            -v "${GITHUB_WORKSPACE}:/work:ro" \
            -v nextoomio-ci-build:/work/build \
            -w /work \
            -e USER_ID="$(id -u)" \
            -e GROUP_ID="$(id -g)" \
            -e NEXTOOMIO_SOURCE_COMMIT="${{ github.sha }}" \
            -e KAS_WORK_DIR=/work/build \
            -e DL_DIR=/work/build/downloads \
            -e SSTATE_DIR=/work/build/sstate-cache \
            ghcr.io/siemens/kas/kas:4.5 \
            kas build /work/kas/ci-hosted.yml

      - name: Copy build artifacts from volume
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/build/tmp/deploy"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v nextoomio-ci-build:/work/build:ro \
            -v "${GITHUB_WORKSPACE}/build/tmp/deploy:/output" \
            ghcr.io/siemens/kas/kas:4.5 \
            sh -ec '
              src=/work/build/build/tmp/deploy
              mkdir -p /output/images/raspberrypi4-64 /output/licenses
              for f in "$src"/images/raspberrypi4-64/*.rootfs.ext4.gz "$src"/images/raspberrypi4-64/*.wic.bz2 "$src"/images/raspberrypi4-64/*.wic.bmap "$src"/images/raspberrypi4-64/*.swu "$src"/images/raspberrypi4-64/*.manifest "$src"/images/raspberrypi4-64/*.rootfs.spdx.json "$src"/images/raspberrypi4-64/*.spdx.tar.zst; do
                if [ -f "$f" ]; then cp -L "$f" /output/images/raspberrypi4-64/; fi
              done
              for f in "$src"/licenses/*/nextoomio-image-*/license.manifest; do
                [ -f "$f" ] || continue
                dest="/output/licenses/${f#"$src"/licenses/}"
                mkdir -p "$(dirname "$dest")"
                cp -L "$f" "$dest"
              done
            '

      - name: Check built root filesystem
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "${GITHUB_WORKSPACE}:/work:rw" -w /work --entrypoint python3 \
            ghcr.io/siemens/kas/kas:4.5 scripts/check_image_rootfs.py \
            build/tmp/deploy/images/raspberrypi4-64/nextoomio-image-raspberrypi4-64.rootfs.ext4.gz --commit "${{ github.sha }}"

      - name: Check required build artifacts and image licenses
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')
        shell: bash
        run: |
          shopt -s nullglob globstar
          image_dir=build/tmp/deploy/images/raspberrypi4-64
          for pattern in 'nextoomio-image-raspberrypi4-64.rootfs.wic.bz2' 'nextoomio-image-raspberrypi4-64.rootfs.wic.bmap' 'nextoomio-image-raspberrypi4-64.rootfs.manifest' 'nextoomio-image-raspberrypi4-64.rootfs.swu' 'nextoomio-image-raspberrypi4-64.rootfs.spdx.json'; do
            files=("$image_dir"/$pattern)
            if (( ${#files[@]} == 0 )); then
              echo "Missing required artifact: $pattern" >&2
              exit 1
            fi
          done
          manifests=(build/tmp/deploy/licenses/*/nextoomio-image-*/license.manifest)
          if (( ${#manifests[@]} != 1 )); then
            echo "Expected one image license.manifest, found ${#manifests[@]}" >&2
            exit 1
          fi
          python3 scripts/check_image_licenses.py "${manifests[0]}" meta-nextoomio/conf/accepted-licenses.txt

      - name: Upload Yocto image, package manifest, and license manifest
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')
        uses: actions/upload-artifact@v4
        with:
          name: nextoomio-rpi4-64-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/**/deploy/images/raspberrypi4-64/*.wic.bz2
            build/**/deploy/images/raspberrypi4-64/*.wic.bmap
            build/**/deploy/images/raspberrypi4-64/*.swu
            build/**/deploy/images/raspberrypi4-64/*.rootfs.manifest
            build/**/deploy/images/raspberrypi4-64/*.manifest
            build/**/deploy/images/raspberrypi4-64/*.rootfs.spdx.json
            build/**/deploy/images/raspberrypi4-64/*.spdx.tar.zst
            build/**/deploy/licenses/**/license.manifest
            !build/**/deploy/images/raspberrypi4-64/*-20[0-9]*
          retention-days: 14

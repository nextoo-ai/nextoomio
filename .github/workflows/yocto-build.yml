name: Yocto Image Build

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode: parse-only (fast recipe/layer check) or full-image (BitBake image build)'
        required: true
        default: 'parse-only'
        type: choice
        options:
          - parse-only
          - full-image
      runner:
        description: 'Target GitHub Actions runner'
        required: true
        default: 'ubuntu-24.04'
        type: choice
        options:
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - self-hosted
  pull_request:
    branches: [main]
    paths:
      - 'kas/**'
      - 'meta-nextoomio/**'
      - '.github/workflows/yocto-build.yml'
  push:
    branches: [main]
    paths:
      - 'kas/**'
      - 'meta-nextoomio/**'
      - '.github/workflows/yocto-build.yml'

concurrency:
  group: yocto-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yocto:
    name: Yocto (${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')) && 'full-image' || 'parse-only' }} on ${{ inputs.runner || 'ubuntu-24.04' }})
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - name: Maximize runner disk space (GitHub-hosted full-image builds only)
        if: (inputs.runner || 'ubuntu-24.04') != 'self-hosted' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image'))
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost \
                      /usr/local/graalvm || true
          docker image prune --all --force || true
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build and cache directories
        run: |
          if [ "${{ inputs.runner || 'ubuntu-24.04' }}" != "self-hosted" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          fi
          mkdir -p "${GITHUB_WORKSPACE}/build"
          mkdir -p "${GITHUB_WORKSPACE}/yocto-cache/downloads"
          mkdir -p "${GITHUB_WORKSPACE}/yocto-cache/sstate-cache"

      - name: Restore Yocto downloads & sstate cache (up to 10 GB GitHub Cache limit)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/yocto-cache/downloads
            ${{ github.workspace }}/yocto-cache/sstate-cache
          key: yocto-${{ inputs.runner || 'ubuntu-24.04' }}-wrynose-${{ hashFiles('kas/**', 'meta-nextoomio/**') }}
          restore-keys: |
            yocto-${{ inputs.runner || 'ubuntu-24.04' }}-wrynose-

      - name: Run BitBake layer & recipe parse verification (parse-only)
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && (inputs.mode || 'parse-only') == 'parse-only')
        run: |
          docker run --rm \
            --user=root \
            --security-opt apparmor=unconfined \
            -v "${GITHUB_WORKSPACE}:/work:rw" \
            -w /work \
            -e USER_ID="$(id -u)" \
            -e GROUP_ID="$(id -g)" \
            -e NEXTOOMIO_SOURCE_COMMIT="${{ github.sha }}" \
            -e KAS_WORK_DIR=/work/build \
            -e DL_DIR=/work/yocto-cache/downloads \
            -e SSTATE_DIR=/work/yocto-cache/sstate-cache \
            ghcr.io/siemens/kas/kas:4.5 \
            kas shell /work/kas/ci-hosted.yml -c "bitbake-layers show-layers && bitbake -p nextoomio-image"

      - name: Build full nextoomio Yocto image (full-image)
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')
        run: |
          docker run --rm \
            --user=root \
            --security-opt apparmor=unconfined \
            -v "${GITHUB_WORKSPACE}:/work:rw" \
            -w /work \
            -e USER_ID="$(id -u)" \
            -e GROUP_ID="$(id -g)" \
            -e NEXTOOMIO_SOURCE_COMMIT="${{ github.sha }}" \
            -e KAS_WORK_DIR=/work/build \
            -e DL_DIR=/work/yocto-cache/downloads \
            -e SSTATE_DIR=/work/yocto-cache/sstate-cache \
            ghcr.io/siemens/kas/kas:4.5 \
            kas build /work/kas/ci-hosted.yml

      - name: Upload Yocto image, package manifest, SPDX SBOM, and license manifest
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'full-image')
        uses: actions/upload-artifact@v4
        with:
          name: nextoomio-rpi4-64-${{ github.sha }}
          path: |
            build/**/deploy/images/raspberrypi4-64/*.wic.bz2
            build/**/deploy/images/raspberrypi4-64/*.wic.bmap
            build/**/deploy/images/raspberrypi4-64/*.rootfs.manifest
            build/**/deploy/images/raspberrypi4-64/*.manifest
            build/**/deploy/images/raspberrypi4-64/*.spdx.tar.zst
            build/**/deploy/licenses/**/license.manifest
          retention-days: 14

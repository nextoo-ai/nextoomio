[workspace]
resolver = "2"
members = [
    "crates/nx-protocol",
    "crates/nextoomio-core",
    "crates/nx-audio",
    "crates/nx-sysd",
]

[workspace.package]
version = "0.0.1-dev"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/nextoo-ai/nextoomio"
rust-version = "1.78"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
nx-protocol = { path = "crates/nx-protocol" }

#!/usr/sbin/nft -f
# nextoomio baseline nftables ruleset (ARCHITECTURE.md section 3.7, AC3)
# Default-deny inbound policy; explicit allow for loopback, conntrack, ICMP, and mDNS.
# Additional enabled features extend this ruleset by adding *.nft files in /etc/nftables.d/.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Drop invalid connection states early
        ct state invalid drop

        # Allow established and related connections (DHCP responses, outgoing sessions)
        ct state established,related accept

        # Allow localhost loopback traffic
        iif "lo" accept

        # Allow ICMP and ICMPv6 (ping, PMTU discovery, IPv6 neighbor discovery)
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # Allow mDNS (Multicast DNS, UDP port 5353, RFC 6762) for device name resolution (AC2)
        udp dport 5353 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# Include modular rule extensions provided by other recipes for enabled features
include "/etc/nftables.d/*.nft"

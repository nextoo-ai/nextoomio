# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "nextoomio"
BBFILE_PATTERN_nextoomio = "^${LAYERDIR}/"
BBFILE_PRIORITY_nextoomio = "10"

LAYERDEPENDS_nextoomio = "core openembedded-layer multimedia-layer networking-layer raspberrypi swupdate"
LAYERSERIES_COMPAT_nextoomio = "wrynose styhead scarthgap"

# nextoomio distribution configuration (ARCHITECTURE.md sections 2, 3.5–3.7, 5.2, 11)

DISTRO = "nextoomio"
DISTRO_NAME = "nextoomio Audio OS"
DISTRO_VERSION = "0.0.1-dev"

# Use systemd as init manager (AD-01)
INIT_MANAGER = "systemd"

# Device hostname (AC2, ARCHITECTURE.md section 3.7)
hostname = "nextoomio"

# Network manager selection (ARCHITECTURE.md section 5.2)
VIRTUAL-RUNTIME_net_manager = "networkmanager"

# Systemd clock synchronization support (AD-21, AC5)
PACKAGECONFIG:append:pn-systemd = " timesyncd"

# Feature selection: ALSA, PipeWire, Wi-Fi/BT support, IPv4/IPv6, ZeroConf
DISTRO_FEATURES:append = " alsa systemd usrmerge wifi bluetooth ipv4 ipv6 zeroconf pam"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl pcmcia 3g nfc"

# Read-only root filesystem with separate /data partition (SYS-04)
IMAGE_FEATURES:append = " read-only-rootfs"

# Hardware watchdog & early boot handoff preparation (AR-01)
ENABLE_UART = "0"
RPI_EXTRA_CONFIG:append = "\n# nextoomio hardware watchdog & audio baseline\ndtparam=watchdog=on\n"

# Redistributable Raspberry Pi boot/Wi-Fi/BT firmware acceptance (ARCHITECTURE.md section 11.6)
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch commercial_ffmpeg"

# Partition-targeted boot files for Wic (D-005, ARCHITECTURE.md section 3.6)
# Selector partition holds only autoboot.txt; slot A boot partition holds full boot tree
IMAGE_BOOT_FILES_label-select = "autoboot.txt"
IMAGE_BOOT_FILES_label-boot_a = "${IMAGE_BOOT_FILES}"
WICVARS:append = " IMAGE_BOOT_FILES_label-select IMAGE_BOOT_FILES_label-boot_a"

# Device identity and image version baseline (AC1, AC2, AC4, P0-F2.3)
NEXTOOMIO_IMAGE_VERSION ?= "${DISTRO_VERSION}"
NEXTOOMIO_BUILD_ID ?= "${DATETIME}"
NEXTOOMIO_HARDWARE_COMPAT ?= "raspberrypi4-64"

# Source commit derivation: derived from git checkout or environment; fails build if missing.
def nextoomio_derive_source_commit(d):
    import subprocess
    commit = d.getVar('NEXTOOMIO_SOURCE_COMMIT')
    if commit and commit != 'unknown':
        return commit
    for search_dir in [d.getVar('LAYERDIR_nextoomio'), d.getVar('COREBASE'), d.getVar('TOPDIR'), '.']:
        if not search_dir:
            continue
        try:
            rev = subprocess.check_output(
                ['git', '-C', search_dir, 'rev-parse', 'HEAD'],
                stderr=subprocess.DEVNULL,
                text=True
            ).strip()
            if rev:
                return rev
        except Exception:
            continue
    bb.fatal("NEXTOOMIO_SOURCE_COMMIT could not be derived from git checkout or environment. Build failed.")

NEXTOOMIO_SOURCE_COMMIT = "${@nextoomio_derive_source_commit(d)}"



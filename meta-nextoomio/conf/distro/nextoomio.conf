# nextoomio distribution configuration (ARCHITECTURE.md sections 2, 3.5–3.7, 5.2, 11)

DISTRO = "nextoomio"
DISTRO_NAME = "nextoomio Audio OS"
DISTRO_VERSION = "0.0.1-dev"

# Use systemd as init manager (AD-01)
INIT_MANAGER = "systemd"

# Feature selection: ALSA, PipeWire, Wi-Fi/BT support, IPv4/IPv6, ZeroConf
DISTRO_FEATURES:append = " alsa systemd usrmerge wifi bluetooth ipv4 ipv6 zeroconf pam"
DISTRO_FEATURES:remove = "x11 wayland vulkan opengl pcmcia 3g nfc"

# Read-only root filesystem with separate /data partition (SYS-04)
IMAGE_FEATURES:append = " read-only-rootfs"

# Hardware watchdog & early boot handoff preparation (AR-01)
ENABLE_UART = "0"
RPI_EXTRA_CONFIG:append = "\n# nextoomio hardware watchdog & audio baseline\ndtparam=watchdog=on\n"

# Redistributable Raspberry Pi boot/Wi-Fi/BT firmware acceptance (ARCHITECTURE.md section 11.6)
LICENSE_FLAGS_ACCEPTED:append = " synaptics-killswitch commercial_ffmpeg"

# kas base configuration for nextoomio Yocto builds (ARCHITECTURE.md section 2, AD-01)
# Layer set pinned to Yocto 6.0 LTS "Wrynose" (P0-F1.1, SYS-03, AD-01, R-07).
header:
  version: 14

distro: nextoomio
target:
  - nextoomio-image

repos:
  nextoomio:
    path: ..
    layers:
      meta-nextoomio:

  bitbake:
    url: https://git.openembedded.org/bitbake
    branch: "2.18"
    commit: 51fd94a67fa17650a9ff623492005972bbc7d26f
    layers:
      bitbake: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    branch: wrynose
    commit: 0f03c732a0a2d0506b41b1abe60b3f368b2300dc
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    branch: wrynose
    commit: 7c25b11156553145fa6b241a2d4f65d94438f804
    layers:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: wrynose
    commit: c0fcd7cca3760ef24e087ac4a31b8f357cb204da
    layers:
      meta-oe:
      meta-multimedia:
      meta-networking:
      meta-python:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: wrynose
    commit: 919588393f41b48cb6c5d832aa35e58a19b6762d

  meta-swupdate:
    url: https://github.com/sbabic/meta-swupdate.git
    branch: wrynose
    commit: 4c355d945f47bd825d950aa62c7aa6f24b437fe0

local_conf_header:
  nextoomio-base: |
    CONF_VERSION = "2"
    PACKAGE_CLASSES = "package_ipk"
    USER_CLASSES ?= "buildstats"
    # Generate SPDX SBOM and per-package license manifests (ARCHITECTURE.md section 11.2)
    INHERIT += "create-spdx"
    COPY_LIC_MANIFEST = "1"
    COPY_LIC_DIRS = "1"
